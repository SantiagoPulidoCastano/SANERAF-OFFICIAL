<main>
  <div class="registro" id="registro">
    <h2> Registrate para continuar al inicio de sesion</h2>

    <form action="login.html" method="get">

    <label for="name"><strong>Nombre completo :</strong></label>
    <input type="text" id="name" placeholder="Ej: Juan Pérez" required><br><br>

    <label for="username"><strong>Nombre de usuario :</strong></label>
    <input type="text" id="username" placeholder="Ej: juanperez12" required><br><br>


    <label for="email"><strong>Correo electrónico :</strong></label>
    <input type="email" id="email" placeholder="SANERAF@ejemplo.com" required><br><br>

    <label for="password"><strong>Contraseña:</strong></label>
    <input type="password" id="password" placeholder="Contraseña1" required><br><br>

    <label for="confirm-password"><strong>Confirma tu contraseña:</strong></label>
    <input type="password" id="confirm-password" placeholder="Confirma tu contraseña" required><br><br>

    <button type="submit" id="entrar">Entrar</button><br><br>

    <a href="pterminos.html" id="pterms" class="pterms" alt="pterms">Terminos y condiciones</a>
    <a href="login.html" id="registrobutton" class="registrobutton" alt="registro">¿Ya tienes cuenta?</a>
    </form>
  </div>
</main>
