<!DOCTYPE html>
<html lang="es">
<head>
  <!-- La cabecera prepara el documento y carga el diseño de la página de registro. -->
  <meta charset="UTF-8">
  <title>SANERAF - Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Santiago Pulido Castaño">
  <link rel="stylesheet" href="styleregistro.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Carter+One&amp;family=Anton&amp;family=DM+Sans:wght@400;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet">
</head>

<body>
 
<main>
  <!-- Este contenedor coloca la imagen y el formulario de registro uno junto al otro. -->
    <div class="registro" id="registro">
      <div class="registro-imagen" id="registro-imagen">
        <img src="IMG/Vertical.png" alt="Imagen de SANERAF">
      </div>
      
      <div class="registro-formulario" id="registro-formulario">
        <!-- El formulario solicita los datos necesarios para crear una cuenta. -->
        <h2>Regístrate para continuar:</h2>
        <form action="index.html" method="get">

          <label for="name-reg"><strong>Nombre:</strong></label>
          <input type="text" id="name-reg" name="name" placeholder="Juan Perez" required>

          <label for="username-reg"><strong>Nombre de usuario:</strong></label>
          <input type="text" id="username-reg" name="username" placeholder="JuanPerez12" required>

          <label for="password-reg"><strong>Contraseña:</strong></label>
          <input type="password" id="password-reg" name="password" placeholder="Juan123" required>

          <label for="passwordconfirm-reg"><strong>Confirme su contraseña:</strong></label>
          <input type="password" id="passwordconfirm-reg" name="passwordconfirm" placeholder="Juan123" required>

          <div class="acciones-registro">
            <button type="submit" id="entrar-reg">Entrar</button>
            <a href="login.html" id="volver-reg" class="volver" alt="volver">Volver</a>
          </div>

        </form>
      </div>
    </div>
</main>

<a href="pterminos.html" id="pterms" class="pterms" alt="pterms">Términos y condiciones</a>

<!-- El cuadro emergente se usa para mostrar avisos de éxito o errores del formulario. -->
<dialog id="ventana">
  <button type="button" id="ventana-cerrar" class="btn-cerrar">×</button>
  <h3 id="ventana-titulo"></h3>
  <p id="ventana-texto"></p>
</dialog>

<script src="functions.js"></script>

</body>
</html>
