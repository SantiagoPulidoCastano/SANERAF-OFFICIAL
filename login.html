<!DOCTYPE html>
<html lang="es">
<head>
  <!-- La cabecera configura el idioma, la vista móvil y los estilos del inicio de sesión. -->
  <meta charset="UTF-8">
  <title>SANERAF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Santiago Pulido Castaño">
  <link rel="stylesheet" href="stylelogin.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Carter+One&amp;family=Anton&amp;family=DM+Sans:wght@400;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet">
</head>

<body>
 
<main>
  <!-- El bloque principal combina una imagen con el formulario para entrar a la cuenta. -->
    <div class="login" id="login">
      <div class="login-imagen" id="login-imagen"> 
        <img src="IMG/Vertical.png" alt="Imagen de SANERAF"> 
      </div>
      <div class="login-formulario" id="login-formulario">
        <!-- El formulario recoge el usuario y la contraseña para validarlos con JavaScript. -->
        <h2>Inicia sesión para continuar:</h2>
        <form action="index.html" method="get">

          <label for="username-login"><strong>Nombre de usuario:</strong></label>
          <input type="text" id="username-login" name="username" placeholder="Usuario" required>

          <label for="password-login"><strong>Contraseña:</strong></label>
          <input type="password" id="password-login" name="password" placeholder="Contraseña" required>

          <button type="submit" id="entrar-login">Entrar</button>

          <a href="registro.html" id="registro" class="registro" alt="registro">¿No tienes cuenta? Registrate</a>
          <a href="recuperar.html" id="recuperar" class="recuperar" alt="recuperar">¿Olvidaste tu contraseña?</a>
          <a href="productos.html" id="volver-login" class="volver" alt="volver">Volver</a>
        </form>
      </div>
    </div>
</main>

<a href="pterminos.html" id="pterms" class="pterms" alt="pterms">Terminos y condiciones</a>

<!-- El cuadro emergente muestra el resultado de la comprobación de acceso. -->
<dialog id="ventana">
  <button type="button" id="ventana-cerrar" class="btn-cerrar">×</button>
  <h3 id="ventana-titulo"></h3>
  <p id="ventana-texto"></p>
</dialog>

<script src="functions.js"></script>

</body>
</html>
